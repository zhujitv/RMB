<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex,nofollow,noarchive,nosnippet,noimageindex,notranslate" />
    <title>NEXTWOOD 供应链协同平台</title>
    <meta http-equiv="refresh" content="0; url=/workspace" />
    <style>
      :root {
        color-scheme: light;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f5f7fa;
        color: #172033;
        font-family:
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          "PingFang SC",
          "Hiragino Sans GB",
          "Microsoft YaHei",
          sans-serif;
      }
      .redirect-card {
        width: min(440px, calc(100% - 32px));
        padding: 32px 36px;
        border: 1px solid #e2e8f0;
        border-radius: 22px;
        background: #fff;
        box-shadow: 0 20px 48px rgba(15, 23, 42, 0.08);
      }
      h1 {
        margin: 0 0 8px;
        font-size: 28px;
      }
      p {
        margin: 0;
        line-height: 1.6;
        color: #475569;
      }
      a {
        color: #2563eb;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main class="redirect-card">
      <h1>NEXTWOOD</h1>
      <p>系统入口已升级，正在跳转到 <a href="/workspace">/workspace</a>。</p>
    </main>
    <script>
      window.location.replace("/workspace");
    </script>
  </body>
</html>
