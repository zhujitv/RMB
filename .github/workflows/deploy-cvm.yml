name: Deploy CVM

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag, or full SHA to deploy"
        required: false
        default: "main"
      require_ci_success:
        description: "Require a successful CI run for the exact commit"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      apply_customer_product_material_code_migration:
        description: "Deprecated: use safe_prisma_migration instead"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      safe_prisma_migration:
        description: "Optional single Prisma migration directory to backup and apply before deploy"
        required: false
        default: ""
  workflow_run:
    workflows:
      - CI
    types:
      - completed

permissions:
  contents: read
  actions: read

concurrency:
  group: rmb-cvm-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Tencent Cloud CVM
    runs-on: ubuntu-latest
    environment: production
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main' &&
        vars.RMB_CVM_AUTO_DEPLOY == 'true'
      )
    env:
      DEPLOY_HOST: ${{ secrets.RMB_CVM_HOST }}
      DEPLOY_PORT: ${{ secrets.RMB_CVM_PORT }}
      DEPLOY_USER: ${{ secrets.RMB_CVM_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.RMB_CVM_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.RMB_CVM_KNOWN_HOSTS }}
      APP_DIR: ${{ vars.RMB_CVM_APP_DIR }}
      SERVICE_NAME: ${{ vars.RMB_CVM_SERVICE }}
      ENV_FILE: ${{ vars.RMB_CVM_ENV_FILE }}
      DB_BACKUP_DIR: ${{ vars.RMB_CVM_DB_BACKUP_DIR }}
      DB_BACKUP_RETENTION_DAYS: ${{ vars.RMB_CVM_DB_BACKUP_RETENTION_DAYS }}
      LOCAL_HEALTH_URL: ${{ vars.RMB_CVM_LOCAL_HEALTH_URL }}
      PUBLIC_HEALTH_URL: ${{ vars.RMB_CVM_PUBLIC_HEALTH_URL }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Resolve deploy target
        id: target
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "workflow_run" ]]; then
            printf 'ref=%s\n' '${{ github.event.workflow_run.head_sha }}' >> "$GITHUB_OUTPUT"
            printf 'require_ci_success=false\n' >> "$GITHUB_OUTPUT"
          else
            printf 'ref=%s\n' '${{ inputs.ref }}' >> "$GITHUB_OUTPUT"
            printf 'require_ci_success=%s\n' '${{ inputs.require_ci_success }}' >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout target commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ steps.target.outputs.ref }}
          fetch-depth: 0

      - name: Verify target commit and CI
        id: sha
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          sha="$(git rev-parse HEAD)"
          git merge-base --is-ancestor "$sha" origin/main || {
            echo "::error::Target commit must be on main."
            exit 1
          }
          if [[ "${{ steps.target.outputs.require_ci_success }}" == "true" ]]; then
            ci_success_count="$(gh api "/repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$sha&status=success&per_page=1" --jq '.total_count')"
            if [[ "$ci_success_count" == "0" ]]; then
              echo "::error::No successful CI run found for $sha. Run CI first or dispatch with require_ci_success=false for an emergency rollback."
              exit 1
            fi
          fi
          printf 'sha=%s\n' "$sha" >> "$GITHUB_OUTPUT"

      - name: Resolve optional database migration
        id: migration
        run: |
          set -euo pipefail
          migration_name=""
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            migration_name='${{ inputs.safe_prisma_migration }}'
            if [[ -z "$migration_name" && '${{ inputs.apply_customer_product_material_code_migration }}' == "true" ]]; then
              migration_name="20260820233000_customer_product_material_code"
            fi
          fi
          if [[ -n "$migration_name" ]]; then
            if [[ ! "$migration_name" =~ ^[0-9]{14}_[a-z0-9_]+$ ]]; then
              echo "::error::safe_prisma_migration must be an existing Prisma migration directory name."
              exit 1
            fi
            if [[ ! -f "prisma/migrations/$migration_name/migration.sql" ]]; then
              echo "::error::Migration SQL not found: prisma/migrations/$migration_name/migration.sql"
              exit 1
            fi
          fi
          printf 'name=%s\n' "$migration_name" >> "$GITHUB_OUTPUT"

      - name: Check deployment secrets
        run: |
          set -euo pipefail
          missing=()
          for name in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY DEPLOY_KNOWN_HOSTS; do
            if [[ -z "${!name:-}" ]]; then
              missing+=("$name")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            printf '::error::Missing required deployment secrets: %s\n' "${missing[*]}"
            exit 1
          fi

      - name: Prepare SSH
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/rmb-cvm-deploy"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/rmb-cvm-deploy" "$HOME/.ssh/known_hosts"

      - name: Ensure CVM database backup directory
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          port="${DEPLOY_PORT:-22}"
          backup_dir="${DB_BACKUP_DIR:-/srv/rmb/shared/db-backups}"
          retention_days="${DB_BACKUP_RETENTION_DAYS:-15}"
          ssh_target="${DEPLOY_USER}@${DEPLOY_HOST}"
          ssh_opts=(-i "$HOME/.ssh/rmb-cvm-deploy" -p "$port" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts")
          ssh "${ssh_opts[@]}" "$ssh_target" "RMB_DB_BACKUP_DIR='$backup_dir' RMB_DB_BACKUP_RETENTION_DAYS='$retention_days' bash -s" <<'REMOTE_SCRIPT'
          set -euo pipefail
          backup_dir="${RMB_DB_BACKUP_DIR:-/srv/rmb/shared/db-backups}"
          retention_days="${RMB_DB_BACKUP_RETENTION_DAYS:-15}"
          [[ "$retention_days" =~ ^[0-9]+$ ]] || retention_days=15

          prune_old_backups() {
            local dir="$1"
            [[ -d "$dir" && -w "$dir" ]] || return 0
            local deleted_count
            deleted_count="$(find "$dir" -maxdepth 1 -type f -name '*-20??????T??????Z.dump' -mtime +"$retention_days" -print -delete | wc -l | tr -d ' ')"
            printf '[rmb-cvm-deploy] pruned %s DB backup(s) older than %s day(s) in %s\n' "$deleted_count" "$retention_days" "$dir"
          }

          current_user="$(id -un)"
          current_group="$(id -gn)"
          if mkdir -p "$backup_dir" 2>/dev/null; then
            chmod 700 "$backup_dir" 2>/dev/null || true
          elif command -v sudo >/dev/null 2>&1 && sudo -n true 2>/dev/null; then
            if ! sudo -n install -d -m 700 -o "$current_user" -g "$current_group" "$backup_dir"; then
              echo "::warning::Cannot prepare shared backup directory with sudo; migrations will use the deploy user's private fallback."
            fi
          else
            echo "::warning::Shared backup directory is not writable and passwordless sudo is unavailable; migrations will use the deploy user's private fallback."
          fi
          if [[ -d "$backup_dir" && -w "$backup_dir" ]]; then
            printf '[rmb-cvm-deploy] shared DB backup directory ready: %s\n' "$backup_dir"
          else
            printf '[rmb-cvm-deploy] shared DB backup directory not writable; private fallback remains enabled: %s\n' "$backup_dir"
          fi
          prune_old_backups "$backup_dir"
          prune_old_backups "$HOME/rmb-db-backups"
          REMOTE_SCRIPT

      - name: Apply single safe Prisma migration
        if: steps.migration.outputs.name != ''
        run: |
          set -euo pipefail
          port="${DEPLOY_PORT:-22}"
          app_dir="${APP_DIR:-/srv/rmb/app}"
          env_file="${ENV_FILE:-/srv/rmb/shared/app.env}"
          backup_dir="${DB_BACKUP_DIR:-/srv/rmb/shared/db-backups}"
          retention_days="${DB_BACKUP_RETENTION_DAYS:-15}"
          ssh_target="${DEPLOY_USER}@${DEPLOY_HOST}"
          ssh_opts=(-i "$HOME/.ssh/rmb-cvm-deploy" -p "$port" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts")
          scp_opts=(-i "$HOME/.ssh/rmb-cvm-deploy" -P "$port" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts")
          migration_name="${{ steps.migration.outputs.name }}"
          local_script="$RUNNER_TEMP/rmb-cvm-db-migration.sh"
          remote_script="/tmp/rmb-cvm-db-migration-$migration_name.sh"
          remote_sql="/tmp/rmb-cvm-db-migration-$migration_name.sql"
          cat > "$local_script" <<'REMOTE_SCRIPT'
          #!/usr/bin/env bash
          set -Eeuo pipefail

          fail() {
            printf '[rmb-cvm-db-migration] ERROR: %s\n' "$*" >&2
            exit 1
          }

          log() {
            printf '[rmb-cvm-db-migration] %s\n' "$*"
          }

          resolve_pg_tool() {
            local tool="$1"
            local candidate
            for candidate in "/usr/pgsql-18/bin/$tool" "/usr/lib/postgresql/18/bin/$tool"; do
              if [[ -x "$candidate" ]]; then
                printf '%s\n' "$candidate"
                return 0
              fi
            done
            command -v "$tool" 2>/dev/null || return 1
          }

          prune_old_backups() {
            local dir="$1"
            local retention_days="${RMB_DB_BACKUP_RETENTION_DAYS:-15}"
            [[ "$retention_days" =~ ^[0-9]+$ ]] || retention_days=15
            [[ -d "$dir" && -w "$dir" ]] || return 0
            local deleted_count
            deleted_count="$(find "$dir" -maxdepth 1 -type f -name '*-20??????T??????Z.dump' -mtime +"$retention_days" -print -delete | wc -l | tr -d ' ')"
            log "pruned $deleted_count DB backup(s) older than $retention_days day(s) in $dir"
          }

          APP_DIR="${RMB_APP_DIR:-/srv/rmb/app}"
          ENV_FILE="${RMB_ENV_FILE:-/srv/rmb/shared/app.env}"
          MIGRATION_NAME="${RMB_MIGRATION_NAME:?RMB_MIGRATION_NAME is required}"
          MIGRATION_SQL="${RMB_MIGRATION_SQL:?RMB_MIGRATION_SQL is required}"
          BACKUP_DIR="${RMB_DB_BACKUP_DIR:-/srv/rmb/shared/db-backups}"

          [[ -d "$APP_DIR" ]] || fail "app directory not found: $APP_DIR"
          [[ -f "$MIGRATION_SQL" ]] || fail "migration SQL file not found: $MIGRATION_SQL"
          [[ -f "$ENV_FILE" ]] || fail "environment file not found: $ENV_FILE"
          PG_DUMP_BIN="$(resolve_pg_tool pg_dump)" || fail "pg_dump is required for the pre-migration backup"
          PSQL_BIN="$(resolve_pg_tool psql)" || fail "psql is required to apply this migration"
          command -v node >/dev/null 2>&1 || fail "node is required to mark Prisma migration metadata"

          cd "$APP_DIR"
          set -a
          # shellcheck disable=SC1090
          source "$ENV_FILE"
          set +a
          [[ -n "${DATABASE_URL:-}" ]] || fail "DATABASE_URL is missing from $ENV_FILE"
          POSTGRES_URL="$(DATABASE_URL="$DATABASE_URL" node <<'NODE'
          const raw = process.env.DATABASE_URL || "";
          const url = new URL(raw);
          for (const name of ["schema", "uselibpqcompat", "connection_limit", "pool_timeout", "pgbouncer", "statement_cache_size"]) {
            url.searchParams.delete(name);
          }
          process.stdout.write(url.toString());
          NODE
          )"
          POSTGRES_SCHEMA="$(DATABASE_URL="$DATABASE_URL" node <<'NODE'
          const raw = process.env.DATABASE_URL || "";
          const url = new URL(raw);
          const schema = url.searchParams.get("schema") || "";
          if (schema && !/^[A-Za-z_][A-Za-z0-9_]*$/.test(schema)) {
            throw new Error("DATABASE_URL schema contains unsupported characters");
          }
          process.stdout.write(schema);
          NODE
          )"
          if [[ -n "$POSTGRES_SCHEMA" ]]; then
            export PGOPTIONS="-c search_path=$POSTGRES_SCHEMA,public"
          fi

          umask 077
          if ! mkdir -p "$BACKUP_DIR" 2>/dev/null; then
            if command -v sudo >/dev/null 2>&1; then
              sudo install -d -m 700 -o "$(id -un)" -g "$(id -gn)" "$BACKUP_DIR" 2>/dev/null || true
            fi
            if ! mkdir -p "$BACKUP_DIR" 2>/dev/null; then
              BACKUP_DIR="$HOME/rmb-db-backups"
              log "shared backup directory is not writable; using $BACKUP_DIR"
              mkdir -p "$BACKUP_DIR"
            fi
          fi
          chmod 700 "$BACKUP_DIR" 2>/dev/null || true
          already_applied="$("$PSQL_BIN" "$POSTGRES_URL" --set=ON_ERROR_STOP=1 --set=migration_name="$MIGRATION_NAME" --tuples-only --no-align <<'SQL'
          SELECT COALESCE((
            SELECT 'true'
            FROM "_prisma_migrations"
            WHERE "migration_name" = :'migration_name'
            LIMIT 1
          ), 'false');
          SQL
          )"
          if [[ "$already_applied" == "true" ]]; then
            log "migration already recorded; skipping SQL: $MIGRATION_NAME"
            rm -f "$MIGRATION_SQL"
            exit 0
          fi
          backup_path="$BACKUP_DIR/$MIGRATION_NAME-$(date -u +%Y%m%dT%H%M%SZ).dump"
          log "creating database backup at $backup_path"
          "$PG_DUMP_BIN" --format=custom --no-owner --no-privileges --file "$backup_path" "$POSTGRES_URL"

          checksum="$(sha256sum "$MIGRATION_SQL" | awk '{print $1}')"
          migration_id="$(node -e "console.log(require('crypto').randomUUID())")"

          log "applying Prisma migration $MIGRATION_NAME"
          "$PSQL_BIN" "$POSTGRES_URL" --set=ON_ERROR_STOP=1 --file "$MIGRATION_SQL"

          "$PSQL_BIN" "$POSTGRES_URL" \
            --set=ON_ERROR_STOP=1 \
            --set=migration_id="$migration_id" \
            --set=migration_name="$MIGRATION_NAME" \
            --set=checksum="$checksum" <<'SQL'
          BEGIN;

          INSERT INTO "_prisma_migrations" (
            "id",
            "checksum",
            "finished_at",
            "migration_name",
            "logs",
            "rolled_back_at",
            "started_at",
            "applied_steps_count"
          )
          SELECT
            :'migration_id',
            :'checksum',
            now(),
            :'migration_name',
            NULL,
            NULL,
            now(),
            1
          WHERE NOT EXISTS (
            SELECT 1 FROM "_prisma_migrations" WHERE "migration_name" = :'migration_name'
          );

          COMMIT;
          SQL

          log "migration complete; backup kept at $backup_path"
          prune_old_backups "$BACKUP_DIR"
          rm -f "$MIGRATION_SQL"
          REMOTE_SCRIPT
          chmod 700 "$local_script"
          scp "${scp_opts[@]}" "$local_script" "$ssh_target:$remote_script"
          scp "${scp_opts[@]}" "prisma/migrations/$migration_name/migration.sql" "$ssh_target:$remote_sql"
          ssh "${ssh_opts[@]}" "$ssh_target" \
            "chmod 700 '$remote_script' && RMB_APP_DIR='$app_dir' RMB_ENV_FILE='$env_file' RMB_DB_BACKUP_DIR='$backup_dir' RMB_DB_BACKUP_RETENTION_DAYS='$retention_days' RMB_MIGRATION_NAME='$migration_name' RMB_MIGRATION_SQL='$remote_sql' '$remote_script'"

      - name: Build incremental git bundle
        id: bundle
        run: |
          set -euo pipefail
          port="${DEPLOY_PORT:-22}"
          app_dir="${APP_DIR:-/srv/rmb/app}"
          ssh_target="${DEPLOY_USER}@${DEPLOY_HOST}"
          ssh_opts=(-i "$HOME/.ssh/rmb-cvm-deploy" -p "$port" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts")
          remote_head="$(ssh "${ssh_opts[@]}" "$ssh_target" "cd '$app_dir' && git rev-parse HEAD")"
          deploy_sha="${{ steps.sha.outputs.sha }}"
          if [[ "$remote_head" == "$deploy_sha" ]]; then
            printf 'up_to_date=true\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git merge-base --is-ancestor "$remote_head" "$deploy_sha" || {
            echo "::error::Server HEAD $remote_head is not an ancestor of $deploy_sha. Refusing non-fast-forward deployment."
            exit 1
          }
          git branch --force deploy-target "$deploy_sha"
          bundle_path="$RUNNER_TEMP/rmb-cvm-$deploy_sha.bundle"
          git bundle create "$bundle_path" deploy-target "^$remote_head"
          printf 'path=%s\n' "$bundle_path" >> "$GITHUB_OUTPUT"
          printf 'up_to_date=false\n' >> "$GITHUB_OUTPUT"

      - name: Upload and run deployment
        if: steps.bundle.outputs.up_to_date != 'true'
        run: |
          set -euo pipefail
          port="${DEPLOY_PORT:-22}"
          app_dir="${APP_DIR:-/srv/rmb/app}"
          service_name="${SERVICE_NAME:-rmb-app.service}"
          env_file="${ENV_FILE:-/srv/rmb/shared/app.env}"
          local_health_url="${LOCAL_HEALTH_URL:-http://127.0.0.1:3000/}"
          ssh_target="${DEPLOY_USER}@${DEPLOY_HOST}"
          ssh_opts=(-i "$HOME/.ssh/rmb-cvm-deploy" -p "$port" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts")
          scp_opts=(-i "$HOME/.ssh/rmb-cvm-deploy" -P "$port" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts")
          deploy_sha="${{ steps.sha.outputs.sha }}"
          remote_bundle="/tmp/rmb-cvm-$deploy_sha.bundle"
          remote_script="/tmp/rmb-cvm-deploy-$deploy_sha.sh"
          scp "${scp_opts[@]}" "${{ steps.bundle.outputs.path }}" "$ssh_target:$remote_bundle"
          scp "${scp_opts[@]}" scripts/deploy-cvm-from-bundle.sh "$ssh_target:$remote_script"
          ssh "${ssh_opts[@]}" "$ssh_target" \
            "chmod 700 '$remote_script' && RMB_DEPLOY_SHA='$deploy_sha' RMB_DEPLOY_BUNDLE='$remote_bundle' RMB_APP_DIR='$app_dir' RMB_SERVICE='$service_name' RMB_ENV_FILE='$env_file' RMB_HEALTH_URL='$local_health_url' '$remote_script'"

      - name: Public health check
        if: steps.bundle.outputs.up_to_date != 'true'
        run: |
          set -euo pipefail
          public_url="${PUBLIC_HEALTH_URL:-https://www.nextwood.net}"
          public_health_ok=0
          for attempt in {1..20}; do
            if curl --fail --silent --show-error --head --max-time 20 "$public_url" >/dev/null; then
              public_health_ok=1
              break
            fi
            echo "Public health not ready yet; retrying ($attempt/20)"
            sleep 2
          done
          [[ "$public_health_ok" == "1" ]]
          echo "Public health check passed: $public_url"

      - name: Already up to date
        if: steps.bundle.outputs.up_to_date == 'true'
        run: echo "CVM already runs ${{ steps.sha.outputs.sha }}."
