name: Deploy CVM

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag, or full SHA to deploy"
        required: false
        default: "main"
      require_ci_success:
        description: "Require a successful CI run for the exact commit"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      apply_customer_product_material_code_migration:
        description: "Deprecated: use safe_prisma_migration instead"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      safe_prisma_migration:
        description: "Optional single Prisma migration directory to backup and apply before deploy"
        required: false
        default: ""
  workflow_run:
    workflows:
      - CI
    types:
      - completed

permissions:
  contents: read
  actions: read

concurrency:
  group: rmb-cvm-production
  cancel-in-progress: false

jobs:
  build:
    name: Build deployment artifact
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main' &&
        vars.RMB_CVM_AUTO_DEPLOY == 'true'
      )
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
      migration_name: ${{ steps.migration.outputs.name }}
      artifact_name: ${{ steps.artifact.outputs.name }}
    env:
      PUBLIC_HEALTH_URL: ${{ vars.RMB_CVM_PUBLIC_HEALTH_URL }}
    steps:
      - name: Resolve deploy target
        id: target
        env:
          WORKFLOW_RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          INPUT_REF: ${{ inputs.ref }}
          INPUT_REQUIRE_CI_SUCCESS: ${{ inputs.require_ci_success }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "workflow_run" ]]; then
            deploy_ref="$WORKFLOW_RUN_SHA"
            require_ci_success="false"
          else
            deploy_ref="${INPUT_REF:-main}"
            require_ci_success="${INPUT_REQUIRE_CI_SUCCESS:-true}"
          fi
          git check-ref-format --branch "$deploy_ref" >/dev/null 2>&1 || {
            echo "::error::Deployment ref contains unsupported characters."
            exit 1
          }
          [[ "$require_ci_success" == "true" || "$require_ci_success" == "false" ]] || {
            echo "::error::require_ci_success must be true or false."
            exit 1
          }
          printf 'ref=%s\n' "$deploy_ref" >> "$GITHUB_OUTPUT"
          printf 'require_ci_success=%s\n' "$require_ci_success" >> "$GITHUB_OUTPUT"

      - name: Checkout target commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ steps.target.outputs.ref }}
          fetch-depth: 0

      - name: Verify target commit and CI
        id: sha
        env:
          GH_TOKEN: ${{ github.token }}
          REQUIRE_CI_SUCCESS: ${{ steps.target.outputs.require_ci_success }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          sha="$(git rev-parse HEAD)"
          git merge-base --is-ancestor "$sha" origin/main || {
            echo "::error::Target commit must be on main."
            exit 1
          }
          [[ "$sha" =~ ^[a-f0-9]{40}$ ]] || {
            echo "::error::Resolved deployment target is not a full commit SHA."
            exit 1
          }
          if [[ "$REQUIRE_CI_SUCCESS" == "true" ]]; then
            ci_success_count="$(gh api "/repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$sha&status=success&per_page=1" --jq '.total_count')"
            if [[ "$ci_success_count" == "0" ]]; then
              echo "::error::No successful CI run found for $sha. Run CI first or dispatch with require_ci_success=false for an emergency rollback."
              exit 1
            fi
          fi
          printf 'sha=%s\n' "$sha" >> "$GITHUB_OUTPUT"

      - name: Resolve optional database migration
        id: migration
        env:
          INPUT_SAFE_MIGRATION: ${{ inputs.safe_prisma_migration }}
          INPUT_LEGACY_MIGRATION: ${{ inputs.apply_customer_product_material_code_migration }}
        run: |
          set -euo pipefail
          migration_name=""
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            migration_name="$INPUT_SAFE_MIGRATION"
            if [[ -z "$migration_name" && "$INPUT_LEGACY_MIGRATION" == "true" ]]; then
              migration_name="20260820233000_customer_product_material_code"
            fi
          fi
          if [[ -n "$migration_name" ]]; then
            if [[ ! "$migration_name" =~ ^[0-9]{14}_[a-z0-9_]+$ ]]; then
              echo "::error::safe_prisma_migration must be an existing Prisma migration directory name."
              exit 1
            fi
            if [[ ! -f "prisma/migrations/$migration_name/migration.sql" ]]; then
              echo "::error::Migration SQL not found: prisma/migrations/$migration_name/migration.sql"
              exit 1
            fi
          fi
          printf 'name=%s\n' "$migration_name" >> "$GITHUB_OUTPUT"

      - name: Setup deployment Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm

      - name: Build isolated deployment artifact
        id: artifact
        env:
          DEPLOY_SHA: ${{ steps.sha.outputs.sha }}
        run: |
          set -euo pipefail
          deploy_sha="$DEPLOY_SHA"
          public_origin="${PUBLIC_HEALTH_URL:-https://www.nextwood.net}"
          public_origin="${public_origin%/}"
          [[ "$public_origin" =~ ^https://[^/?#[:space:]@]+$ ]] || {
            echo "::error::RMB_CVM_PUBLIC_HEALTH_URL must be an HTTPS origin without credentials or a path."
            exit 1
          }
          export RMB_SKIP_LOCAL_ENV_FILES=1
          export NEXT_TELEMETRY_DISABLED=1
          DATABASE_URL="postgresql://127.0.0.1:5432/rmb_prisma_generate" \
            npm ci --prefer-offline --no-audit --fund=false
          env -u VERCEL_ENV -u VERCEL_TARGET_ENV -u STRICT_PRODUCTION_SECURITY \
            RMB_SKIP_LOCAL_ENV_FILES=1 \
            DATABASE_URL="postgresql://127.0.0.1:5432/rmb_build_only" \
            APP_URL="$public_origin" \
            NEXT_PUBLIC_APP_URL="$public_origin" \
            SECURITY_BUILD_MODE=preview \
            npm run build:app
          printf '%s\n' "$deploy_sha" > .next/RMB_DEPLOY_SHA
          artifact_path="$RUNNER_TEMP/rmb-next-$deploy_sha.tar.gz"
          artifact_name="rmb-next-$deploy_sha"
          tar --exclude='.next/cache' -czf "$artifact_path" .next
          printf 'path=%s\n' "$artifact_path" >> "$GITHUB_OUTPUT"
          printf 'name=%s\n' "$artifact_name" >> "$GITHUB_OUTPUT"

      - name: Upload deployment artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: ${{ steps.artifact.outputs.path }}
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  deploy:
    name: Deploy to Tencent Cloud CVM
    needs: build
    runs-on: ubuntu-latest
    environment: production
    env:
      APP_DIR: ${{ vars.RMB_CVM_APP_DIR }}
      SERVICE_NAME: ${{ vars.RMB_CVM_SERVICE }}
      ENV_FILE: ${{ vars.RMB_CVM_ENV_FILE }}
      DB_BACKUP_DIR: ${{ vars.RMB_CVM_DB_BACKUP_DIR }}
      DB_BACKUP_RETENTION_DAYS: ${{ vars.RMB_CVM_DB_BACKUP_RETENTION_DAYS }}
      LOCAL_HEALTH_URL: ${{ vars.RMB_CVM_LOCAL_HEALTH_URL }}
      PUBLIC_HEALTH_URL: ${{ vars.RMB_CVM_PUBLIC_HEALTH_URL }}
    steps:
      - name: Checkout exact deployment commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.build.outputs.sha }}
          fetch-depth: 0

      - name: Download verified deployment artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: ${{ runner.temp }}/rmb-deployment-artifact

      - name: Check deployment secrets
        env:
          DEPLOY_HOST: ${{ secrets.RMB_CVM_HOST }}
          DEPLOY_USER: ${{ secrets.RMB_CVM_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.RMB_CVM_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.RMB_CVM_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          missing=()
          for name in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY DEPLOY_KNOWN_HOSTS; do
            if [[ -z "${!name:-}" ]]; then
              missing+=("$name")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            printf '::error::Missing required deployment secrets: %s\n' "${missing[*]}"
            exit 1
          fi

      - name: Prepare SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.RMB_CVM_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.RMB_CVM_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/rmb-cvm-deploy"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/rmb-cvm-deploy" "$HOME/.ssh/known_hosts"

      - name: Ensure CVM database backup directory
        if: github.event_name == 'workflow_dispatch'
        env:
          DEPLOY_HOST: ${{ secrets.RMB_CVM_HOST }}
          DEPLOY_PORT: ${{ secrets.RMB_CVM_PORT }}
          DEPLOY_USER: ${{ secrets.RMB_CVM_USER }}
        run: |
          set -euo pipefail
          port="${DEPLOY_PORT:-22}"
          backup_dir="${DB_BACKUP_DIR:-/srv/rmb/shared/db-backups}"
          retention_days="${DB_BACKUP_RETENTION_DAYS:-15}"
          ssh_target="${DEPLOY_USER}@${DEPLOY_HOST}"
          ssh_opts=(-i "$HOME/.ssh/rmb-cvm-deploy" -p "$port" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts")
          ssh "${ssh_opts[@]}" "$ssh_target" "RMB_DB_BACKUP_DIR='$backup_dir' RMB_DB_BACKUP_RETENTION_DAYS='$retention_days' bash -s" <<'REMOTE_SCRIPT'
          set -euo pipefail
          backup_dir="${RMB_DB_BACKUP_DIR:-/srv/rmb/shared/db-backups}"
          retention_days="${RMB_DB_BACKUP_RETENTION_DAYS:-15}"
          [[ "$retention_days" =~ ^[0-9]+$ ]] || retention_days=15

          prune_old_backups() {
            local dir="$1"
            [[ -d "$dir" && -w "$dir" ]] || return 0
            local deleted_count
            deleted_count="$(find "$dir" -maxdepth 1 -type f -name '*-20??????T??????Z.dump' -mtime +"$retention_days" -print -delete | wc -l | tr -d ' ')"
            printf '[rmb-cvm-deploy] pruned %s DB backup(s) older than %s day(s) in %s\n' "$deleted_count" "$retention_days" "$dir"
          }

          current_user="$(id -un)"
          current_group="$(id -gn)"
          if mkdir -p "$backup_dir" 2>/dev/null; then
            chmod 700 "$backup_dir" 2>/dev/null || true
          elif command -v sudo >/dev/null 2>&1 && sudo -n true 2>/dev/null; then
            if ! sudo -n install -d -m 700 -o "$current_user" -g "$current_group" "$backup_dir"; then
              echo "::error::Cannot prepare shared backup directory with sudo: $backup_dir"
              exit 1
            fi
          else
            echo "::error::Shared backup directory is not writable and passwordless sudo is unavailable: $backup_dir"
            exit 1
          fi
          if [[ -d "$backup_dir" && -w "$backup_dir" ]]; then
            printf '[rmb-cvm-deploy] shared DB backup directory ready: %s\n' "$backup_dir"
          else
            printf '[rmb-cvm-deploy] shared DB backup directory not writable: %s\n' "$backup_dir" >&2
            exit 1
          fi
          prune_old_backups "$backup_dir"
          REMOTE_SCRIPT

      - name: Apply single safe Prisma migration
        if: needs.build.outputs.migration_name != ''
        env:
          DEPLOY_HOST: ${{ secrets.RMB_CVM_HOST }}
          DEPLOY_PORT: ${{ secrets.RMB_CVM_PORT }}
          DEPLOY_USER: ${{ secrets.RMB_CVM_USER }}
          MIGRATION_NAME: ${{ needs.build.outputs.migration_name }}
        run: |
          set -euo pipefail
          port="${DEPLOY_PORT:-22}"
          app_dir="${APP_DIR:-/srv/rmb/app}"
          env_file="${ENV_FILE:-/srv/rmb/shared/app.env}"
          backup_dir="${DB_BACKUP_DIR:-/srv/rmb/shared/db-backups}"
          retention_days="${DB_BACKUP_RETENTION_DAYS:-15}"
          ssh_target="${DEPLOY_USER}@${DEPLOY_HOST}"
          ssh_opts=(-i "$HOME/.ssh/rmb-cvm-deploy" -p "$port" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts")
          scp_opts=(-i "$HOME/.ssh/rmb-cvm-deploy" -P "$port" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts")
          migration_name="$MIGRATION_NAME"
          local_script="$RUNNER_TEMP/rmb-cvm-db-migration.sh"
          remote_script="/tmp/rmb-cvm-db-migration-$migration_name.sh"
          remote_sql="/tmp/rmb-cvm-db-migration-$migration_name.sql"
          cat > "$local_script" <<'REMOTE_SCRIPT'
          #!/usr/bin/env bash
          set -Eeuo pipefail

          fail() {
            printf '[rmb-cvm-db-migration] ERROR: %s\n' "$*" >&2
            exit 1
          }

          log() {
            printf '[rmb-cvm-db-migration] %s\n' "$*"
          }

          resolve_pg_tool() {
            local tool="$1"
            local candidate
            for candidate in "/usr/pgsql-18/bin/$tool" "/usr/lib/postgresql/18/bin/$tool"; do
              if [[ -x "$candidate" ]]; then
                printf '%s\n' "$candidate"
                return 0
              fi
            done
            command -v "$tool" 2>/dev/null || return 1
          }

          prune_old_backups() {
            local dir="$1"
            local retention_days="${RMB_DB_BACKUP_RETENTION_DAYS:-15}"
            [[ "$retention_days" =~ ^[0-9]+$ ]] || retention_days=15
            [[ -d "$dir" && -w "$dir" ]] || return 0
            local deleted_count
            deleted_count="$(find "$dir" -maxdepth 1 -type f -name '*-20??????T??????Z.dump' -mtime +"$retention_days" -print -delete | wc -l | tr -d ' ')"
            log "pruned $deleted_count DB backup(s) older than $retention_days day(s) in $dir"
          }

          load_database_url() {
            if [[ -r "$ENV_FILE" ]]; then
              set -a
              # shellcheck disable=SC1090
              source "$ENV_FILE"
              set +a
              return 0
            fi
            command -v sudo >/dev/null 2>&1 || fail "environment file is protected and sudo is unavailable: $ENV_FILE"
            sudo -n test -r "$ENV_FILE" 2>/dev/null || fail "environment file is not readable by deploy user or passwordless sudo: $ENV_FILE"
            DATABASE_URL="$(sudo -n env RMB_ENV_FILE="$ENV_FILE" bash -c '
              set -Eeuo pipefail
              set -a
              source "$RMB_ENV_FILE"
              set +a
              [[ -n "${DATABASE_URL:-}" ]]
              printf "%s" "$DATABASE_URL"
            ')" || fail "DATABASE_URL could not be loaded from protected environment file"
            export DATABASE_URL
          }

          APP_DIR="${RMB_APP_DIR:-/srv/rmb/app}"
          ENV_FILE="${RMB_ENV_FILE:-/srv/rmb/shared/app.env}"
          MIGRATION_NAME="${RMB_MIGRATION_NAME:?RMB_MIGRATION_NAME is required}"
          MIGRATION_SQL="${RMB_MIGRATION_SQL:?RMB_MIGRATION_SQL is required}"
          BACKUP_DIR="${RMB_DB_BACKUP_DIR:-/srv/rmb/shared/db-backups}"

          [[ -d "$APP_DIR" ]] || fail "app directory not found: $APP_DIR"
          [[ -f "$MIGRATION_SQL" ]] || fail "migration SQL file not found: $MIGRATION_SQL"
          [[ -f "$ENV_FILE" ]] || fail "environment file not found: $ENV_FILE"
          PG_DUMP_BIN="$(resolve_pg_tool pg_dump)" || fail "pg_dump is required for the pre-migration backup"
          PSQL_BIN="$(resolve_pg_tool psql)" || fail "psql is required to apply this migration"
          command -v node >/dev/null 2>&1 || fail "node is required to mark Prisma migration metadata"

          cd "$APP_DIR"
          load_database_url
          [[ -n "${DATABASE_URL:-}" ]] || fail "DATABASE_URL is missing from $ENV_FILE"
          POSTGRES_URL="$(DATABASE_URL="$DATABASE_URL" node <<'NODE'
          const raw = process.env.DATABASE_URL || "";
          const url = new URL(raw);
          for (const name of ["schema", "uselibpqcompat", "connection_limit", "pool_timeout", "pgbouncer", "statement_cache_size"]) {
            url.searchParams.delete(name);
          }
          process.stdout.write(url.toString());
          NODE
          )"
          POSTGRES_SCHEMA="$(DATABASE_URL="$DATABASE_URL" node <<'NODE'
          const raw = process.env.DATABASE_URL || "";
          const url = new URL(raw);
          const schema = url.searchParams.get("schema") || "";
          if (schema && !/^[A-Za-z_][A-Za-z0-9_]*$/.test(schema)) {
            throw new Error("DATABASE_URL schema contains unsupported characters");
          }
          process.stdout.write(schema);
          NODE
          )"
          if [[ -n "$POSTGRES_SCHEMA" ]]; then
            export PGOPTIONS="-c search_path=$POSTGRES_SCHEMA,public"
          fi

          umask 077
          if ! mkdir -p "$BACKUP_DIR" 2>/dev/null; then
            if command -v sudo >/dev/null 2>&1; then
              sudo install -d -m 700 -o "$(id -un)" -g "$(id -gn)" "$BACKUP_DIR" 2>/dev/null || true
            fi
            if ! mkdir -p "$BACKUP_DIR" 2>/dev/null; then
              fail "shared backup directory is not writable: $BACKUP_DIR"
            fi
          fi
          chmod 700 "$BACKUP_DIR" 2>/dev/null || true
          [[ -w "$BACKUP_DIR" ]] || fail "shared backup directory is not writable: $BACKUP_DIR"
          already_applied="$("$PSQL_BIN" "$POSTGRES_URL" --set=ON_ERROR_STOP=1 --set=migration_name="$MIGRATION_NAME" --tuples-only --no-align <<'SQL'
          SELECT COALESCE((
            SELECT 'true'
            FROM "_prisma_migrations"
            WHERE "migration_name" = :'migration_name'
            LIMIT 1
          ), 'false');
          SQL
          )"
          if [[ "$already_applied" == "true" ]]; then
            log "migration already recorded; skipping SQL: $MIGRATION_NAME"
            rm -f "$MIGRATION_SQL"
            exit 0
          fi
          backup_path="$BACKUP_DIR/$MIGRATION_NAME-$(date -u +%Y%m%dT%H%M%SZ).dump"
          log "creating database backup at $backup_path"
          "$PG_DUMP_BIN" --format=custom --no-owner --no-privileges --file "$backup_path" "$POSTGRES_URL"

          checksum="$(sha256sum "$MIGRATION_SQL" | awk '{print $1}')"
          migration_id="$(node -e "console.log(require('crypto').randomUUID())")"

          log "applying Prisma migration $MIGRATION_NAME"
          "$PSQL_BIN" "$POSTGRES_URL" --set=ON_ERROR_STOP=1 --file "$MIGRATION_SQL"

          "$PSQL_BIN" "$POSTGRES_URL" \
            --set=ON_ERROR_STOP=1 \
            --set=migration_id="$migration_id" \
            --set=migration_name="$MIGRATION_NAME" \
            --set=checksum="$checksum" <<'SQL'
          BEGIN;

          INSERT INTO "_prisma_migrations" (
            "id",
            "checksum",
            "finished_at",
            "migration_name",
            "logs",
            "rolled_back_at",
            "started_at",
            "applied_steps_count"
          )
          SELECT
            :'migration_id',
            :'checksum',
            now(),
            :'migration_name',
            NULL,
            NULL,
            now(),
            1
          WHERE NOT EXISTS (
            SELECT 1 FROM "_prisma_migrations" WHERE "migration_name" = :'migration_name'
          );

          COMMIT;
          SQL

          log "migration complete; backup kept at $backup_path"
          prune_old_backups "$BACKUP_DIR"
          rm -f "$MIGRATION_SQL"
          REMOTE_SCRIPT
          chmod 700 "$local_script"
          scp "${scp_opts[@]}" "$local_script" "$ssh_target:$remote_script"
          scp "${scp_opts[@]}" "prisma/migrations/$migration_name/migration.sql" "$ssh_target:$remote_sql"
          ssh "${ssh_opts[@]}" "$ssh_target" \
            "chmod 700 '$remote_script' && RMB_APP_DIR='$app_dir' RMB_ENV_FILE='$env_file' RMB_DB_BACKUP_DIR='$backup_dir' RMB_DB_BACKUP_RETENTION_DAYS='$retention_days' RMB_MIGRATION_NAME='$migration_name' RMB_MIGRATION_SQL='$remote_sql' '$remote_script'"

      - name: Build incremental git bundle
        id: bundle
        env:
          DEPLOY_HOST: ${{ secrets.RMB_CVM_HOST }}
          DEPLOY_PORT: ${{ secrets.RMB_CVM_PORT }}
          DEPLOY_USER: ${{ secrets.RMB_CVM_USER }}
          DEPLOY_SHA: ${{ needs.build.outputs.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          port="${DEPLOY_PORT:-22}"
          app_dir="${APP_DIR:-/srv/rmb/app}"
          ssh_target="${DEPLOY_USER}@${DEPLOY_HOST}"
          ssh_opts=(-i "$HOME/.ssh/rmb-cvm-deploy" -p "$port" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts")
          app_dir_b64="$(printf '%s' "$app_dir" | base64 -w0)"
          remote_state="$(ssh "${ssh_opts[@]}" "$ssh_target" "RMB_APP_DIR_B64='$app_dir_b64' bash -s" <<'REMOTE_STATE'
          set -euo pipefail
          app_dir="$(printf '%s' "$RMB_APP_DIR_B64" | base64 -d)"
          cd "$app_dir"
          remote_head="$(git rev-parse --verify HEAD 2>/dev/null || true)"
          deployed_sha=""
          build_sha=""
          if [[ -f .rmb-deployed-sha ]]; then
            deployed_sha="$(tr -d '\r\n' < .rmb-deployed-sha)"
          fi
          if [[ -f .next/RMB_DEPLOY_SHA ]]; then
            build_sha="$(tr -d '\r\n' < .next/RMB_DEPLOY_SHA)"
          fi
          printf '%s\n%s\n%s\n' "$remote_head" "$deployed_sha" "$build_sha"
          REMOTE_STATE
          )"
          remote_head="$(sed -n '1p' <<< "$remote_state")"
          deployed_sha="$(sed -n '2p' <<< "$remote_state")"
          build_sha="$(sed -n '3p' <<< "$remote_state")"
          deploy_sha="$DEPLOY_SHA"
          if [[ "$deployed_sha" =~ ^[a-f0-9]{40}$ ]]; then
            base_deployed_sha="$deployed_sha"
          else
            base_deployed_sha="$(gh api "/repos/$GITHUB_REPOSITORY/actions/workflows/deploy-cvm.yml/runs?status=success&per_page=1" --jq '.workflow_runs[0].head_sha // empty')"
            [[ "$base_deployed_sha" =~ ^[a-f0-9]{40}$ ]] || {
              echo "::error::No successful deployment baseline is available and the server marker is missing."
              exit 1
            }
            echo "::warning::Server deployed-SHA marker is missing; using the latest successful deployment baseline $base_deployed_sha."
          fi
          git cat-file -e "$base_deployed_sha^{commit}"
          git merge-base --is-ancestor "$base_deployed_sha" "$deploy_sha" || {
            echo "::error::Last deployed SHA $base_deployed_sha is not an ancestor of target $deploy_sha."
            exit 1
          }
          printf 'base_sha=%s\n' "$base_deployed_sha" >> "$GITHUB_OUTPUT"
          if [[ "$deployed_sha" == "$deploy_sha" && "$build_sha" == "$deploy_sha" ]]; then
            printf 'up_to_date=true\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git branch --force deploy-target "$deploy_sha"
          bundle_path="$RUNNER_TEMP/rmb-cvm-$deploy_sha.bundle"
          if [[ "$remote_head" == "$deploy_sha" ]]; then
            git bundle create "$bundle_path" deploy-target "^$deploy_sha^"
          elif [[ -n "$remote_head" ]]; then
            git merge-base --is-ancestor "$remote_head" "$deploy_sha" || {
              echo "::error::Server HEAD $remote_head is not an ancestor of $deploy_sha. Refusing non-fast-forward deployment."
              exit 1
            }
            git bundle create "$bundle_path" deploy-target "^$remote_head"
          else
            echo "::error::Server checkout has no readable HEAD; refusing an in-place deployment."
            exit 1
          fi
          printf 'path=%s\n' "$bundle_path" >> "$GITHUB_OUTPUT"
          printf 'up_to_date=false\n' >> "$GITHUB_OUTPUT"

      - name: Upload and run deployment
        if: steps.bundle.outputs.up_to_date != 'true'
        env:
          DEPLOY_HOST: ${{ secrets.RMB_CVM_HOST }}
          DEPLOY_PORT: ${{ secrets.RMB_CVM_PORT }}
          DEPLOY_USER: ${{ secrets.RMB_CVM_USER }}
          DEPLOY_SHA: ${{ needs.build.outputs.sha }}
          BASE_DEPLOYED_SHA: ${{ steps.bundle.outputs.base_sha }}
          APPLIED_MIGRATION: ${{ needs.build.outputs.migration_name }}
          SOURCE_BUNDLE_PATH: ${{ steps.bundle.outputs.path }}
          BUILD_ARCHIVE_PATH: ${{ runner.temp }}/rmb-deployment-artifact/rmb-next-${{ needs.build.outputs.sha }}.tar.gz
        run: |
          set -euo pipefail
          port="${DEPLOY_PORT:-22}"
          app_dir="${APP_DIR:-/srv/rmb/app}"
          service_name="${SERVICE_NAME:-rmb-app.service}"
          expected_env_file="${ENV_FILE:-/srv/rmb/shared/app.env}"
          local_origin="${LOCAL_HEALTH_URL:-http://127.0.0.1:3000/}"
          public_origin="${PUBLIC_HEALTH_URL:-https://www.nextwood.net}"
          local_ready_url="${local_origin%/}/api/health"
          public_ready_url="${public_origin%/}/api/health"
          ssh_target="${DEPLOY_USER}@${DEPLOY_HOST}"
          ssh_opts=(-i "$HOME/.ssh/rmb-cvm-deploy" -p "$port" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts")
          scp_opts=(-i "$HOME/.ssh/rmb-cvm-deploy" -P "$port" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts")
          deploy_sha="$DEPLOY_SHA"
          base_deployed_sha="$BASE_DEPLOYED_SHA"
          applied_migration="$APPLIED_MIGRATION"
          remote_bundle="/tmp/rmb-cvm-$deploy_sha.bundle"
          remote_archive="/tmp/rmb-next-$deploy_sha.tar.gz"
          remote_script="/tmp/rmb-cvm-deploy-$deploy_sha.sh"
          remote_config="/tmp/rmb-cvm-deploy-$deploy_sha.env"
          local_config="$RUNNER_TEMP/rmb-cvm-deploy-$deploy_sha.env"
          {
            printf 'RMB_DEPLOY_SHA=%q\n' "$deploy_sha"
            printf 'RMB_BASE_DEPLOYED_SHA=%q\n' "$base_deployed_sha"
            printf 'RMB_APPLIED_MIGRATION=%q\n' "$applied_migration"
            printf 'RMB_DEPLOY_BUNDLE=%q\n' "$remote_bundle"
            printf 'RMB_BUILD_ARCHIVE=%q\n' "$remote_archive"
            printf 'RMB_APP_DIR=%q\n' "$app_dir"
            printf 'RMB_SERVICE=%q\n' "$service_name"
            printf 'RMB_EXPECTED_ENV_FILE=%q\n' "$expected_env_file"
            printf 'RMB_READY_URL=%q\n' "$local_ready_url"
            printf 'RMB_PUBLIC_READY_URL=%q\n' "$public_ready_url"
            printf 'RMB_ROLLBACK_HEALTH_URL=%q\n' "$local_origin"
          } > "$local_config"
          scp "${scp_opts[@]}" "$SOURCE_BUNDLE_PATH" "$ssh_target:$remote_bundle"
          scp "${scp_opts[@]}" "$BUILD_ARCHIVE_PATH" "$ssh_target:$remote_archive"
          scp "${scp_opts[@]}" scripts/deploy-cvm-from-bundle.sh "$ssh_target:$remote_script"
          scp "${scp_opts[@]}" "$local_config" "$ssh_target:$remote_config"
          ssh "${ssh_opts[@]}" "$ssh_target" "bash -s -- '$remote_script' '$remote_config'" <<'REMOTE_DEPLOY'
          set -euo pipefail
          remote_script="$1"
          remote_config="$2"
          cleanup_remote_files() { rm -f -- "$remote_config" "$remote_script"; }
          trap cleanup_remote_files EXIT
          chmod 700 "$remote_script"
          set -a
          # shellcheck disable=SC1090
          source "$remote_config"
          set +a
          "$remote_script"
          REMOTE_DEPLOY

      - name: Public health check
        env:
          EXPECTED_SHA: ${{ needs.build.outputs.sha }}
        run: |
          set -euo pipefail
          public_url="${PUBLIC_HEALTH_URL:-https://www.nextwood.net}"
          public_url="${public_url%/}/api/health"
          expected_sha="$EXPECTED_SHA"
          public_health_ok=0
          for attempt in {1..20}; do
            if response="$(curl --fail --silent --show-error --max-time 20 "$public_url")"; then
              if HEALTH_RESPONSE="$response" EXPECTED_SHA="$expected_sha" node -e '
                const body = JSON.parse(process.env.HEALTH_RESPONSE || "{}");
                process.exit(body.status === "ok" && body.version === process.env.EXPECTED_SHA ? 0 : 1);
              '; then
                public_health_ok=1
                break
              fi
            fi
            echo "Public health not ready yet; retrying ($attempt/20)"
            sleep 2
          done
          [[ "$public_health_ok" == "1" ]]
          echo "Public health check passed: $public_url"

      - name: Already up to date
        if: steps.bundle.outputs.up_to_date == 'true'
        env:
          DEPLOY_SHA: ${{ needs.build.outputs.sha }}
        run: echo "CVM already runs $DEPLOY_SHA."

      - name: Remove temporary SSH credentials
        if: always()
        run: rm -f -- "$HOME/.ssh/rmb-cvm-deploy" "$HOME/.ssh/known_hosts"
