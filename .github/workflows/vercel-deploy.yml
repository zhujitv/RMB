name: Vercel Deploy

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vercel-deploy-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  explain:
    runs-on: ubuntu-latest
    steps:
      - name: Deployment is handled by Vercel Git integration
        run: |
          echo "NEXTWOOD production deploys are handled by the Vercel Git integration."
          echo "Push to main and Vercel will build/deploy the matching commit automatically."
          echo "GitHub Actions CI only verifies code with npm run verify:ci; it does not publish production."
          echo "Database migrations are not run by Vercel build. Run npm run db:deploy separately when schema changes."
          echo "This workflow intentionally does not call the Vercel CLI or require VERCEL_TOKEN."
          echo "If Vercel does not show a deployment, check the Vercel project Git connection first."
          echo "Commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
